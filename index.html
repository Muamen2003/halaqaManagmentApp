    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _origFetch;
          if (_origFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _currentFetch || _origFetch;
                },
                set: function(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
