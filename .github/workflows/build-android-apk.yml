name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run lint

      - name: Build embedded web application
        run: npm run build:android:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android --assetPath assets-native

      - name: Sync application into Android
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk halaqa-management.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: halaqa-management-apk
          path: halaqa-management.apk
          if-no-files-found: error
          retention-days: 30
